name: tests

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip yt-dlp cryptography
      - name: Run existing offline suite
        run: python test_scout.py
      - name: Run per-user auth tests
        run: python -m unittest test_scout_auth.py -v
